<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Usuários</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body>
<h1>Usuários</h1><nav><a th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/usuarios}">Usuários</a><a th:href="@{/emprestimos}">Empréstimos</a></nav><p><a th:href="@{/usuarios/novo}">Cadastrar usuário</a></p>
<p th:if="${#lists.isEmpty(itens)}">Nenhum usuário cadastrado.</p><table th:unless="${#lists.isEmpty(itens)}"><thead><tr><th>Nome</th><th>Está com empréstimo?</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${itens}"><td th:text="${item.nome}"></td><td th:text="${item.emprestimo ? 'Sim' : 'Não'}"></td><td><a th:href="@{/usuarios/editar/{id}(id=${item.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/usuarios/excluir/{id}(id=${item.id})}"><button>Excluir</button></form></td></tr></tbody></table></body></html>
