<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Empréstimos</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body>
<h1>Empréstimos</h1><nav><a th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/usuarios}">Usuários</a><a th:href="@{/emprestimos}">Empréstimos</a></nav><p><a th:href="@{/emprestimos/novo}">Cadastrar empréstimo</a></p>
<p th:if="${#lists.isEmpty(itens)}">Nenhum empréstimo cadastrado.</p><table th:unless="${#lists.isEmpty(itens)}"><thead><tr><th>Livro</th><th>Usuário</th><th>Data do empréstimo</th><th>Vencimento</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${itens}"><td th:text="${item.livro}"></td><td th:text="${item.usuario}"></td><td th:text="${item.dataEmprestimo}"></td><td th:text="${item.dataVencimento}"></td><td><a th:href="@{/emprestimos/editar/{id}(id=${item.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/emprestimos/excluir/{id}(id=${item.id})}"><button>Excluir</button></form></td></tr></tbody></table></body></html>
