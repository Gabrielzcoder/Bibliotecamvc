<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Autores</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body>
<h1>Autores</h1><nav><a th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/usuarios}">Usuários</a><a th:href="@{/emprestimos}">Empréstimos</a></nav><p><a th:href="@{/autores/novo}">Cadastrar autor</a></p>
<p th:if="${#lists.isEmpty(itens)}">Nenhum autor cadastrado.</p><table th:unless="${#lists.isEmpty(itens)}"><thead><tr><th>Nome</th><th>Nacionalidade</th><th>Livro</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${itens}"><td th:text="${item.nome}"></td><td th:text="${item.nacionalidade}"></td><td th:text="${item.livro}"></td><td><a th:href="@{/autores/editar/{id}(id=${item.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/autores/excluir/{id}(id=${item.id})}"><button>Excluir</button></form></td></tr></tbody></table></body></html>
