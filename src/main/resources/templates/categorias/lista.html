<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Categorias</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head><body>
<h1>Categorias</h1><nav><a th:href="@{/livros}">Livros</a><a th:href="@{/autores}">Autores</a><a th:href="@{/categorias}">Categorias</a><a th:href="@{/usuarios}">Usuários</a><a th:href="@{/emprestimos}">Empréstimos</a></nav><p><a th:href="@{/categorias/novo}">Cadastrar categoria</a></p>
<p th:if="${#lists.isEmpty(itens)}">Nenhuma categoria cadastrada.</p><table th:unless="${#lists.isEmpty(itens)}"><thead><tr><th>Gênero</th><th>Idade mínima</th><th>Ações</th></tr></thead><tbody><tr th:each="item : ${itens}"><td th:text="${item.genero}"></td><td th:text="${item.idadeMinima}"></td><td><a th:href="@{/categorias/editar/{id}(id=${item.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/categorias/excluir/{id}(id=${item.id})}"><button>Excluir</button></form></td></tr></tbody></table></body></html>
